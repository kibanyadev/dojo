version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    # Routine bumps wait a week after release; security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      gomod:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    # TypeScript majors need their own migration (TS 7 broke the build).
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node majors follow the Node runtime in the Dockerfile.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-web:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    # TypeScript majors need their own migration (TS 7 broke the build).
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node majors follow the Node runtime in the Dockerfile.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-app:
        patterns:
          - '*'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - '*'
