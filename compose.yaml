name: dojo

services:
  db:
    image: postgres:18.7-alpine3.24@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    environment:
      POSTGRES_USER: dojo
      POSTGRES_DB: dojo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - db-data:/var/lib/postgresql
    networks: [default, operator]
    healthcheck:
      # -h 127.0.0.1: the init-time server listens on the socket only.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "dojo", "-d", "dojo"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: migrate
    environment:
      GOOSE_DBSTRING: postgres://dojo:${POSTGRES_PASSWORD}@db:5432/dojo?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db-roles:
    image: postgres:18.7-alpine3.24@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    entrypoint: ["sh", "/roles.sh"]
    environment:
      PGHOST: db
      PGUSER: dojo
      PGDATABASE: dojo
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DOJO_API_DB_PASSWORD: ${DOJO_API_DB_PASSWORD:?copy .env.example to .env}
      DOJO_ADMIN_DB_PASSWORD: ${DOJO_ADMIN_DB_PASSWORD:?copy .env.example to .env}
    volumes:
      - ./db/roles.sh:/roles.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # The nightly job (db/jobs/nightly.sql), run on demand locally with `make prune`; AWS schedules it (M0b).
  prune:
    profiles: ["jobs"]
    image: postgres:18.7-alpine3.24@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    entrypoint: ["psql", "--no-psqlrc", "-f", "/nightly.sql"]
    environment:
      PGHOST: db
      PGUSER: dojo
      PGDATABASE: dojo
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/jobs/nightly.sql:/nightly.sql:ro
    depends_on:
      db-roles:
        condition: service_completed_successfully
    restart: "no"

  # `dojo-admin bootstrap <login>` (design 3.7), run on demand with `make admin-bootstrap LOGIN=<login>`.
  # The migration role writes the first operator; the dojo_admin service role never does. It holds no
  # OAuth credentials: the login lookup is a public GitHub call.
  admin-bootstrap:
    profiles: ["jobs"]
    build:
      context: .
      target: dojo-admin
    environment:
      DOJO_ENV: local
      GITHUB_API_URL: ${DOJO_ADMIN_GITHUB_API_URL:-http://fake-github:8081}
      BOOTSTRAP_DATABASE_URL: postgres://dojo:${POSTGRES_PASSWORD}@db:5432/dojo?sslmode=disable&application_name=dojo-admin-bootstrap
    networks: [operator]
    depends_on:
      db-roles:
        condition: service_completed_successfully
      fake-github:
        condition: service_healthy
    restart: "no"

  # `dojo-catalog-load -version <commit>` (design 3.8), run on demand with `make catalog-load CATALOG=<dir> VERSION=<commit>`.
  # The migration role writes the catalog tables; the S3 keys are the stand-in's only account (production
  # gives the job its own, put-only under bundles/). CATALOG_DIR defaults to the repo's fixture catalog.
  catalog-load:
    profiles: ["jobs"]
    build:
      context: .
      target: dojo-catalog-load
    environment:
      DOJO_ENV: local
      CATALOG_DATABASE_URL: postgres://dojo:${POSTGRES_PASSWORD}@db:5432/dojo?sslmode=disable&application_name=dojo-catalog-load
      DOJO_S3_ENDPOINT: http://s3:9000
      DOJO_S3_REGION: ${DOJO_S3_REGION:-us-east-1}
      DOJO_S3_BUCKET: ${DOJO_S3_BUCKET:-dojo-catalog}
      DOJO_S3_ACCESS_KEY: ${DOJO_S3_ACCESS_KEY:?copy .env.example to .env}
      DOJO_S3_SECRET_KEY: ${DOJO_S3_SECRET_KEY:?copy .env.example to .env}
      DOJO_S3_PATH_STYLE: "true"
    volumes:
      - ${CATALOG_DIR:-./internal/catalog/testdata/catalog}:/catalog:ro
    depends_on:
      db-roles:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    restart: "no"

  # The S3 stand-in (design 1.7): ticket bundles live here, as in S3 in production. RustFS, not MinIO:
  # MinIO's community repo is archived and its images are gone from Docker Hub and Quay. The API reaches it
  # as s3:9000 on the compose network; the published port is loopback only, for the presigned URLs the CLI
  # downloads from. Unset DOJO_S3_PORT = 9000; set but empty = a random free port (the integration run).
  s3:
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    environment:
      RUSTFS_ACCESS_KEY: ${DOJO_S3_ACCESS_KEY:?copy .env.example to .env}
      RUSTFS_SECRET_KEY: ${DOJO_S3_SECRET_KEY:?copy .env.example to .env}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - s3-data:/data
    ports:
      - "127.0.0.1:${DOJO_S3_PORT-9000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  # One-off: creates the private catalog bucket (idempotent). Production creates it in Terraform.
  s3-init:
    image: amazon/aws-cli:2.42.1@sha256:b0102d2269f87d8531d931c1a59e248101ace586886e6c077058d94c1c37b846
    entrypoint: ["sh", "-c", 'aws s3api head-bucket --bucket "$$BUCKET" || aws s3api create-bucket --bucket "$$BUCKET"']
    environment:
      AWS_ENDPOINT_URL: http://s3:9000
      AWS_ACCESS_KEY_ID: ${DOJO_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${DOJO_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${DOJO_S3_REGION:-us-east-1}
      AWS_PAGER: ""
      BUCKET: ${DOJO_S3_BUCKET:-dojo-catalog}
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  # The email stand-in (design 1.7): SMTP in on 1025 (compose network only), a web inbox and HTTP API on 8025.
  # Production sends through Amazon SES over SMTP with the same code. Unset MAILPIT_PORT = 8025; set but empty =
  # a random free port (the integration run). Loopback only.
  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports:
      - "127.0.0.1:${MAILPIT_PORT-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 4s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      DOJO_ENV: local
      # Email (internal/mail): the sender talks SMTP to Mailpit here and to SES in production.
      DOJO_SMTP_HOST: ${DOJO_SMTP_HOST:-mailpit}
      DOJO_SMTP_PORT: ${DOJO_SMTP_PORT:-1025}
      DOJO_EMAIL_DOMAIN: ${DOJO_EMAIL_DOMAIN:-dojo.test}
      # Where learner reports are forwarded (POST /v1/reports); Mailpit catches it locally.
      DOJO_REPORTS_TO: ${DOJO_REPORTS_TO:-reports@dojo.test}
      # Object store (internal/storage). The API signs URLs for DOJO_S3_PUBLIC_ENDPOINT, the address the
      # host (the CLI) reaches the published port on; it connects to s3:9000 itself.
      DOJO_S3_ENDPOINT: http://s3:9000
      DOJO_S3_PUBLIC_ENDPOINT: ${DOJO_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      DOJO_S3_REGION: ${DOJO_S3_REGION:-us-east-1}
      DOJO_S3_BUCKET: ${DOJO_S3_BUCKET:-dojo-catalog}
      DOJO_S3_ACCESS_KEY: ${DOJO_S3_ACCESS_KEY:?copy .env.example to .env}
      DOJO_S3_SECRET_KEY: ${DOJO_S3_SECRET_KEY:?copy .env.example to .env}
      DOJO_S3_PATH_STYLE: "true"
      # Caddy is the one proxy in front of the API (design 3.1).
      TRUSTED_PROXY_HOPS: "1"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # The fake GitHub client from FAKE_GITHUB_CLIENTS below; the browser and the API reach it by different names.
      # The host-side overrides are DOJO_-prefixed: GitHub Actions exports GITHUB_API_URL (and more) into
      # every step, and compose would read it, pointing the API at the real GitHub.
      GITHUB_CLIENT_ID: ${DOJO_GITHUB_CLIENT_ID:-dojo-web-local}
      GITHUB_CLIENT_SECRET: ${DOJO_GITHUB_CLIENT_SECRET:-web-local-only}
      GITHUB_AUTHORIZE_URL: ${DOJO_GITHUB_AUTHORIZE_URL:-http://localhost:8081}
      GITHUB_OAUTH_URL: ${DOJO_GITHUB_OAUTH_URL:-http://fake-github:8081}
      GITHUB_API_URL: ${DOJO_GITHUB_API_URL:-http://fake-github:8081}
      # Ours, no scopes: lifts the anonymous limit of the commit reads. Empty locally.
      DOJO_GITHUB_READ_TOKEN: ${DOJO_GITHUB_READ_TOKEN:-}
      DOJO_COMMIT_VERIFY_INTERVAL_SECONDS: ${DOJO_COMMIT_VERIFY_INTERVAL_SECONDS:-60}
      DOJO_COMMIT_VERIFY_BATCH: ${DOJO_COMMIT_VERIFY_BATCH:-20}
      DOJO_AI_ADAPTER: ${DOJO_AI_ADAPTER:-standin}
      DOJO_REVIEW_INTERVAL_SECONDS: ${DOJO_REVIEW_INTERVAL_SECONDS:-10}
      DOJO_REVIEW_BATCH: ${DOJO_REVIEW_BATCH:-5}
      # Web Push (design 3.10): our VAPID key, and the fake-push stand-in the endpoint allowlist and the dial
      # guard make an exception for (the API refuses to start in pre and pro with the origins set).
      DOJO_VAPID_PRIVATE_KEY: ${DOJO_VAPID_PRIVATE_KEY:?copy .env.example to .env}
      DOJO_PUSH_ALLOWED_ORIGINS: http://fake-push:8080
      TERMS_VERSION: ${TERMS_VERSION:?copy .env.example to .env}
      AUTH_STATE_KEY: ${AUTH_STATE_KEY:-local-dev-state-key-not-a-secret-0123456789}
      DATABASE_URL: postgres://dojo_api:${DOJO_API_DB_PASSWORD:?copy .env.example to .env}@db:5432/dojo?sslmode=disable&application_name=dojo-api
    ports:
      - "127.0.0.1:${API_PORT:-}:8080"
    depends_on:
      db-roles:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/dojo-api", "healthcheck"]
      interval: 2s
      timeout: 4s
      retries: 15
    restart: unless-stopped

  # The operator service (ADR 0002, design 3.7): published on loopback only, never behind the edge.
  # Unset ADMIN_PORT = 8090; set but empty = a random free port (the integration run).
  admin:
    build:
      context: .
      target: dojo-admin
    environment:
      DOJO_ENV: local
      # The operator's own OAuth App (the fake's dojo-admin-local client), not the web app's. The browser
      # reaches the fake at localhost:8081, this container as fake-github. DOJO_ADMIN_ prefix on the host
      # side: it keeps the web app's DOJO_GITHUB_* overrides apart, and GitHub Actions' own GITHUB_* out.
      GITHUB_CLIENT_ID: ${DOJO_ADMIN_GITHUB_CLIENT_ID:-dojo-admin-local}
      GITHUB_CLIENT_SECRET: ${DOJO_ADMIN_GITHUB_CLIENT_SECRET:-admin-local-only}
      GITHUB_AUTHORIZE_URL: ${DOJO_ADMIN_GITHUB_AUTHORIZE_URL:-http://localhost:8081}
      GITHUB_OAUTH_URL: ${DOJO_ADMIN_GITHUB_OAUTH_URL:-http://fake-github:8081}
      GITHUB_API_URL: ${DOJO_ADMIN_GITHUB_API_URL:-http://fake-github:8081}
      DATABASE_URL: postgres://dojo_admin:${DOJO_ADMIN_DB_PASSWORD:?copy .env.example to .env}@db:5432/dojo?sslmode=disable&application_name=dojo-admin
    ports:
      - "127.0.0.1:${ADMIN_PORT-8090}:8090"
    # Its own network: the edge and the API cannot reach it; it reaches the database and the fake GitHub.
    networks: [operator]
    depends_on:
      db-roles:
        condition: service_completed_successfully
      fake-github:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/dojo-admin", "healthcheck"]
      interval: 2s
      timeout: 4s
      retries: 15
    restart: unless-stopped

  fake-github:
    build:
      context: .
      target: fake-github
    # default for the API, operator so the admin service can reach it server side for sign-in.
    networks: [default, operator]
    environment:
      # id:secret:redirect_uri|redirect_uri;... The web client and the operator client (design 3.7).
      FAKE_GITHUB_CLIENTS: ${FAKE_GITHUB_CLIENTS:-dojo-web-local:web-local-only:http://localhost:8080/v1/auth/github/callback;dojo-admin-local:admin-local-only:http://127.0.0.1:8090/auth/github/callback}
      # Device flow is per OAuth App, like GitHub: the CLI uses the web client's id (design 3.1).
      FAKE_GITHUB_DEVICE_CLIENTS: ${FAKE_GITHUB_DEVICE_CLIENTS:-dojo-web-local}
      # What the browser opens for verification_uri; the API reaches the fake as fake-github, so the Host header is no use.
      FAKE_GITHUB_PUBLIC_URL: ${FAKE_GITHUB_PUBLIC_URL:-http://localhost:8081}
      # Seconds between polls; tests and the dojo login e2e can lower it.
      FAKE_GITHUB_DEVICE_INTERVAL: ${FAKE_GITHUB_DEVICE_INTERVAL:-5}
      # Unauthenticated reads allowed per remote address per hour; 0 is no limit (the rate-limit test sets it).
      FAKE_GITHUB_RATE_LIMIT: ${FAKE_GITHUB_RATE_LIMIT:-0}
      # Bare repositories <login>/dojo.git behind the commit and compare reads (design 3.9). The integration
      # run mounts a host directory here (compose.it.yaml) so the test can push to it.
      FAKE_GITHUB_GIT_ROOT: /git
    ports:
      # The browser is redirected to the authorize page. Unset = 8081; set but empty = a random free port.
      - "127.0.0.1:${FAKE_GITHUB_PORT-8081}:8081"
    healthcheck:
      test: ["CMD", "/fake-github", "healthcheck"]
      interval: 2s
      timeout: 4s
      retries: 15
    restart: unless-stopped

  # The Web Push stand-in (design 3.10). The API reaches it as http://fake-push:8080/push/<token>; the
  # published loopback port is for tests, which read what arrived. Unset = 8082; set but empty = random.
  fake-push:
    build:
      context: .
      target: fake-push
    ports:
      - "127.0.0.1:${FAKE_PUSH_PORT-8082}:8080"
    healthcheck:
      test: ["CMD", "/fake-push", "healthcheck"]
      interval: 2s
      timeout: 4s
      retries: 15
    restart: unless-stopped

  edge:
    build:
      context: .
      target: edge
      args:
        PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    ports:
      # Unset EDGE_PORT = 8080; set but empty = a random free port (the integration run).
      - "127.0.0.1:${EDGE_PORT-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 4s
      retries: 15
    restart: unless-stopped

networks:
  operator:

volumes:
  db-data:
  s3-data:
